# Local development services for the vehicle rental platform.
# Usage (from repo root):  pnpm db:up   |  pnpm db:down  |  pnpm db:logs
# PostgreSQL + PostGIS (Phase 1), Mailpit e-mail catcher (Phase 2) and MinIO
# S3-compatible object storage for vehicle photos (Phase 5, development only).
name: vehicle-rental

services:
  db:
    image: postgis/postgis:17-3.5
    container_name: vehicle-rental-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vehicle_rental}
      # Sri Lanka is UTC+05:30; the app stores UTC regardless, but a fixed
      # server timezone keeps local psql sessions predictable.
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once when the volume is first created: creates the test database.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vehicle_rental}']
      interval: 5s
      timeout: 5s
      retries: 12

  # Local email catcher (Phase 2+): the API sends via SMTP on 1025, inbox UI/API on 8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: vehicle-rental-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 500
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 12

  # Local S3-compatible object storage (Phase 5+): vehicle photos. Development only;
  # production uses any S3-compatible provider through the same client (TECH_DECISIONS D42).
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: vehicle-rental-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    # The Chainguard image is minimal (no shell/curl), so readiness is checked by the API at startup.

volumes:
  db-data:
  minio-data:
