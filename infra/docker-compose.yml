# Local development services for the vehicle rental platform.
# Usage (from repo root):  pnpm db:up   |  pnpm db:down  |  pnpm db:logs
# Only PostgreSQL + PostGIS is needed in Phase 1. Mailpit/MinIO are added when
# email (Phase 2) and file uploads (Phase 3) are implemented.
name: vehicle-rental

services:
  db:
    image: postgis/postgis:17-3.5
    container_name: vehicle-rental-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vehicle_rental}
      # Sri Lanka is UTC+05:30; the app stores UTC regardless, but a fixed
      # server timezone keeps local psql sessions predictable.
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once when the volume is first created: creates the test database.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vehicle_rental}']
      interval: 5s
      timeout: 5s
      retries: 12

  # Local email catcher (Phase 2+): the API sends via SMTP on 1025, inbox UI/API on 8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: vehicle-rental-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 500
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db-data:
