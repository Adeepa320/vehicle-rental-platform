# Continuous integration: install, lint, typecheck, migrate + seed against a
# throwaway PostGIS service, test, build. No deployment and no secrets required.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vehicle_rental
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vehicle_rental"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vehicle_rental
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/vehicle_rental_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Reads the pnpm version from the "packageManager" field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create test database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE vehicle_rental_test;"

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate and seed (dev database)
        run: pnpm db:migrate && pnpm db:seed

      - name: Test
        run: pnpm test

      - name: Format check
        run: pnpm format:check
