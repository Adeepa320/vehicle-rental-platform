packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  argon2: true
  '@swc/core': true
  esbuild: true
  unrs-resolver: true
  '@scarf/scarf': false
# Security floors for transitive runtime dependencies (pnpm audit --prod, 2026-10-28;
# SECURITY_AND_PRIVACY §14). @nestjs/platform-express 12.1.x pins multer 2.4.0 and
# Express resolves body-parser / qs below the patched releases. Nest 12.3.x carries
# the fix but is younger than the minimum release age, so it is not excluded from
# that guard. Remove these floors once the Nest / Express ranges resolve to them.
overrides:
  multer: ^2.5.0
  body-parser: ^2.4.0
  qs: ^6.16.1
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.7'
  - '@turbo/darwin-arm64@2.11.7'
  - '@turbo/linux-64@2.11.7'
  - '@turbo/linux-arm64@2.11.7'
  - '@turbo/windows-64@2.11.7'
  - '@turbo/windows-arm64@2.11.7'
  - '@types/node@24.19.1'
  - nestjs-pino@5.3.0
  - pino@10.4.0
  - supertest@7.3.1
  - turbo@2.11.7
  - nodemailer@10.0.14
